{% assign content = include.service.en %}{% if page.lang == 'es' %}{% assign content = include.service.es %}{% endif %}<article class="service-card surface-card border-subtle"><span class="service-card__badge code-badge">{{ content.tag }}</span><h2 class="headline-md">{{ content.title }}</h2><p class="body-md">{{ content.summary }}</p><div class="service-card__tags">{% for tag in content.tech_stack %}<span class="tag-chip code-badge">{{ tag }}</span>{% endfor %}</div></article>
