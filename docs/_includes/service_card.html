{% assign service = include.service %}{% assign content = service[page.lang] | default: service.en %}<article class="service-card"><span class="service-card__index">{{ service.order | prepend: '0' | slice: 0, 2 }}</span><h3>{{ content.title }}</h3><p>{{ content.summary }}</p><p class="service-card__evidence">{{ content.evidence_boundary }}</p><a class="text-link" href="{{ content.proof_url | relative_url }}">{{ content.proof_label }}</a></article>
