{% assign page_title = page.title | default: site.title %}
{% assign page_description = page.description | default: site.description %}
{% assign page_language = page.lang | default: 'en' %}
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
  <title>{{ page_title }}</title><meta name="description" content="{{ page_description }}"><meta name="robots" content="index,follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page_language == 'es' %}<link rel="alternate" hreflang="es" href="{{ page.url | absolute_url }}"><link rel="alternate" hreflang="en" href="{{ page.alternate_url | default: '/' | absolute_url }}">{% else %}<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}"><link rel="alternate" hreflang="es" href="{{ page.alternate_url | default: '/es/' | absolute_url }}">{% endif %}
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  <meta property="og:type" content="website"><meta property="og:site_name" content="{{ site.title }}"><meta property="og:title" content="{{ page_title }}"><meta property="og:description" content="{{ page_description }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:locale" content="{% if page_language == 'es' %}es_CO{% else %}en_US{% endif %}">
  <meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{ page_title }}"><meta name="twitter:description" content="{{ page_description }}"><meta name="theme-color" content="#0b304a">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}"><link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"{{ site.author }}","url":"{{ site.url }}","email":"{{ site.email }}","sameAs":["https://github.com/{{ site.github_username }}","https://www.linkedin.com/in/{{ site.linkedin_username }}/"],"jobTitle":"AI & Data Solutions Architect"}</script>
</head>
